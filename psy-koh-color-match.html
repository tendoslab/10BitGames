<script>
(function() {
    const isMobile = ('ontouchstart' in window) || (window.innerWidth <= 768);
    const hostId = isMobile ? 'game-host-mobile' : 'game-host-desktop';
    const host = document.getElementById(hostId);

    const shadow = host.attachShadow({mode: 'closed'});

    const style = document.createElement('style');
    style.textContent = `
        #game-wrapper {
            width: min(94vw, 520px);

            font-family: 'Karla', Arial, sans-serif;
            color: #EAFFF0;
            user-select: none;
            position: relative;
        }
        ${isMobile ? `
        #game-wrapper { width: 100%; height: 100%; max-width: 480px; max-height: 100dvh; margin: 0 auto; border-radius: 0; border-width: 0; }
        ` : `
        #game-wrapper { min-height: min(88vh, 660px); display: flex; flex-direction: column; justify-content: center; }
        `}
        * { box-sizing: border-box; }
        .pk-hidden { display: none !important; }
        .pk-screen { display: flex; flex-direction: column; align-items: center; width: 100%; }
        h1.pk-title { font-family: 'Bungee', sans-serif; font-weight: 400; font-size: clamp(20px, 6vw, 28px); letter-spacing: 1.5px; color: #5AD696; text-align: center; margin: 4px 0 4px; text-shadow: 0 0 18px rgba(90,214,150,0.35); }
        .pk-sub { text-align: center; color: #8aa294; font-size: 13px; margin: 0 0 16px; letter-spacing: 0.3px; line-height: 1.5; }
        .pk-btn {
            font-family: 'Karla', Arial, sans-serif;
            font-weight: 700;
            font-size: 15px;
            padding: 12px 22px;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg,#5AD696 0%,#31B076 100%);
            color: #0b1710;
            box-shadow: 0 6px 16px rgba(90,214,150,0.3);
            width: 100%;
            max-width: 320px;
            margin: 6px 0;
            min-height: 46px;
        }
        .pk-btn:active { transform: translateY(1px); }
        .pk-btn.secondary {
            background: #1e2a21;
            color: #cfe8d8;
            border: 2px solid #33472f;
            box-shadow: none;
        }
        .pk-btn.ghost {
            background: transparent;
            color: #8aa294;
            border: 2px solid transparent;
            box-shadow: none;
            font-size: 13px;
            padding: 8px 14px;
            min-height: 36px;
        }
        .pk-badge-row { display: flex; justify-content: center; gap: 8px; margin: 8px 0 2px; flex-wrap: wrap; }
        .pk-badge {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.4px;
            color: #cfe8d8;
            background: #1e2a21;
            border: 1px solid #33472f;
            border-radius: 999px;
            padding: 4px 10px;
        }
        .pk-mascot-wrap { position: relative; width: 132px; height: 132px; margin: 6px auto 10px; }
        .pk-round-label { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: #6f8a77; text-align: center; margin: 0 0 6px; }
        .pk-scene-frame {
            width: 100%;
            aspect-ratio: 16 / 10;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #33472f;
            background: #0c110d;
            position: relative;
        }
        .pk-scene-frame svg { width: 100%; height: 100%; display: block; }
        .pk-timerbar-track { width: 100%; height: 8px; background: #1e2a21; border-radius: 999px; margin: 10px 0 4px; overflow: hidden; }
        .pk-timerbar-fill { height: 100%; background: linear-gradient(90deg,#5AD696,#31B076); border-radius: 999px; transition: width 0.12s linear, background 0.3s; }
        .pk-caption { text-align: center; color: #cfe8d8; font-size: 14px; margin: 4px 0 0; min-height: 20px; }
        .pk-countdown-num { font-family: 'Bungee', sans-serif; font-size: 72px; color: #5AD696; text-shadow: 0 0 30px rgba(90,214,150,0.5); }
        .pk-question-obj { text-align: center; font-size: 17px; font-weight: 700; color: #F5FFF7; margin: 2px 0 12px; }
        .pk-question-obj span { color: #FF6B4A; }
        .pk-picker-row { display: flex; gap: 16px; align-items: center; justify-content: center; margin: 4px 0 6px; flex-wrap: wrap; }
        .pk-wheel-wrap { position: relative; width: 168px; height: 168px; touch-action: none; }
        .pk-sv-wrap { position: relative; width: 108px; height: 108px; touch-action: none; border-radius: 10px; overflow: hidden; border: 2px solid #33472f; }
        .pk-sv-cursor, .pk-hue-cursor {
            position: absolute;
            width: 16px; height: 16px;
            border: 2.5px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 0 1.5px rgba(0,0,0,0.5), 0 2px 6px rgba(0,0,0,0.4);
            transform: translate(-50%,-50%);
            pointer-events: none;
        }
        .pk-swatch-row { display: flex; gap: 10px; justify-content: center; margin: 10px 0; }
        .pk-swatch-card { flex: 1; max-width: 150px; background: #1e2a21; border: 1px solid #33472f; border-radius: 10px; padding: 8px; text-align: center; }
        .pk-swatch-card .pk-swatch-label { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: #6f8a77; margin-bottom: 6px; }
        .pk-swatch-block { width: 100%; height: 46px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); margin-bottom: 6px; }
        .pk-swatch-hex { font-size: 11px; color: #a9c2b1; font-family: monospace; }
        .pk-score-big { font-family: 'Bungee', sans-serif; font-size: 56px; text-align: center; color: #5AD696; margin: 6px 0 0; text-shadow: 0 0 24px rgba(90,214,150,0.4); }
        .pk-score-flavor { text-align: center; color: #cfe8d8; font-size: 14px; margin: 2px 0 14px; min-height: 20px; }
        .pk-grid-strip { display: flex; gap: 6px; justify-content: center; margin: 6px 0 14px; }
        .pk-grid-cell { width: 26px; height: 26px; border-radius: 6px; }
        .pk-results-avg { font-family: 'Bungee', sans-serif; font-size: 44px; text-align: center; color: #5AD696; margin: 4px 0; }
        .pk-mode-row { display: flex; gap: 8px; justify-content: center; margin: 4px 0 2px; }
        .pk-chip {
            font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 999px;
            background: #1e2a21; border: 2px solid #33472f; color: #a9c2b1; cursor: pointer;
        }
        .pk-chip.on { background: #2a4a35; border-color: #5AD696; color: #eafff0; }
        .pk-sound-toggle { position: absolute; top: 10px; left: 10px; background: none; border: none; color: #6f8a77; font-size: 18px; cursor: pointer; padding: 6px; z-index: 5; }
    `;

    const wrapper = document.createElement('div');
    wrapper.id = 'game-wrapper';
    wrapper.innerHTML = `
        <button class="pk-sound-toggle" id="btn-sound" title="Toggle sound">&#128266;</button>

        <div class="pk-screen" id="screen-start">
            <div class="pk-mascot-wrap" id="mascot-start"></div>
            <h1 class="pk-title">PSY-KOH'S<br>COLOR MATCH</h1>
            <p class="pk-sub">Memorise the scenery. One object gets picked. Match its exact color from memory — Psy-Koh wears your guess the whole time.</p>
            <div class="pk-badge-row" id="start-badges"></div>
            <button class="pk-btn" id="btn-daily">Daily Challenge</button>
            <button class="pk-btn secondary" id="btn-practice">Practice (random)</button>
            <button class="pk-btn ghost" id="btn-howto">How to play</button>
        </div>

        <div class="pk-screen pk-hidden" id="screen-howto">
            <h1 class="pk-title" style="font-size:20px;">HOW TO PLAY</h1>
            <p class="pk-sub" style="text-align:left; max-width:340px;">
                1. Five sceneries, one after another. Study the colored objects before the timer bar runs out.<br><br>
                2. The scene hides and you're asked about ONE object. Drag the hue ring and the square to match its color from memory — Psy-Koh changes color live as you drag.<br><br>
                3. Scoring rewards how perceptually close your color is, not just a raw number match — close misses still score well.<br><br>
                4. Daily Challenge is the same five sceneries for everyone, once a day. Share your result grid and streak. Practice is fully randomised, every time.
            </p>
            <button class="pk-btn" id="btn-howto-back">Back</button>
        </div>

        <div class="pk-screen pk-hidden" id="screen-countdown">
            <div class="pk-mascot-wrap" id="mascot-countdown"></div>
            <div class="pk-countdown-num" id="countdown-num">3</div>
            <p class="pk-caption" id="countdown-caption">Get ready to memorise...</p>
        </div>

        <div class="pk-screen pk-hidden" id="screen-scene">
            <p class="pk-round-label" id="scene-round-label">Round 1 / 5</p>
            <div class="pk-scene-frame" id="scene-frame"></div>
            <div class="pk-timerbar-track"><div class="pk-timerbar-fill" id="scene-timer-fill" style="width:100%;"></div></div>
            <p class="pk-caption">Memorise this scenery&hellip;</p>
        </div>

        <div class="pk-screen pk-hidden" id="screen-question">
            <div class="pk-mascot-wrap" id="mascot-question"></div>
            <p class="pk-question-obj" id="question-text">What color was the <span id="question-obj-name">thing</span>?</p>
            <div class="pk-picker-row">
                <div class="pk-wheel-wrap" id="hue-wheel-wrap">
                    <canvas id="hue-canvas" width="168" height="168"></canvas>
                    <div class="pk-hue-cursor" id="hue-cursor"></div>
                </div>
                <div class="pk-sv-wrap" id="sv-wrap">
                    <canvas id="sv-canvas" width="108" height="108"></canvas>
                    <div class="pk-sv-cursor" id="sv-cursor"></div>
                </div>
            </div>
            <button class="pk-btn" id="btn-submit-color">Lock In Color</button>
        </div>

        <div class="pk-screen pk-hidden" id="screen-reveal">
            <div class="pk-mascot-wrap" id="mascot-reveal"></div>
            <div class="pk-score-big" id="reveal-score">0</div>
            <p class="pk-score-flavor" id="reveal-flavor">&nbsp;</p>
            <div class="pk-swatch-row">
                <div class="pk-swatch-card">
                    <div class="pk-swatch-label">Your pick</div>
                    <div class="pk-swatch-block" id="reveal-swatch-you"></div>
                    <div class="pk-swatch-hex" id="reveal-hex-you">#000000</div>
                </div>
                <div class="pk-swatch-card">
                    <div class="pk-swatch-label">Actual</div>
                    <div class="pk-swatch-block" id="reveal-swatch-actual"></div>
                    <div class="pk-swatch-hex" id="reveal-hex-actual">#000000</div>
                </div>
            </div>
            <button class="pk-btn" id="btn-next-round">Next Scenery</button>
        </div>

        <div class="pk-screen pk-hidden" id="screen-results">
            <div class="pk-mascot-wrap" id="mascot-results"></div>
            <h1 class="pk-title" style="font-size:20px;">RUN COMPLETE</h1>
            <div class="pk-results-avg" id="results-avg">0</div>
            <p class="pk-score-flavor" id="results-flavor">&nbsp;</p>
            <div class="pk-grid-strip" id="results-grid"></div>
            <div class="pk-badge-row" id="results-badges"></div>
            <button class="pk-btn" id="btn-share">Share Result</button>
            <button class="pk-btn secondary" id="btn-play-again">Play Again</button>
            <button class="pk-btn ghost" id="btn-menu">Main Menu</button>
        </div>
    `;

    shadow.appendChild(style);
    shadow.appendChild(wrapper);
    function $(id) { return shadow.getElementById(id); }
    function showScreen(id) {
        shadow.querySelectorAll('.pk-screen').forEach(s => s.classList.add('pk-hidden'));
        $(id).classList.remove('pk-hidden');
    }

    // ── Audio (procedural, no sample files) ─────────────────────────────────
    let audioCtx = null, soundEnabled = true;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    function tone(freq0, freq1, dur, type, gain, delay) {
        if (!audioCtx || !soundEnabled) return;
        const t0 = audioCtx.currentTime + (delay || 0);
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.connect(g); g.connect(audioCtx.destination);
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq0, t0);
        osc.frequency.exponentialRampToValueAtTime(Math.max(freq1, 1), t0 + dur);
        g.gain.setValueAtTime(gain, t0);
        g.gain.linearRampToValueAtTime(0.0001, t0 + dur);
        osc.start(t0); osc.stop(t0 + dur + 0.02);
    }
    function playSound(type) {
        if (!audioCtx || !soundEnabled) return;
        switch (type) {
            case 'click': tone(500, 460, 0.06, 'triangle', 0.12); break;
            case 'tick': tone(880, 860, 0.045, 'square', 0.05); break;
            case 'warn': tone(500, 480, 0.09, 'square', 0.09); break;
            case 'go': tone(300, 900, 0.28, 'sawtooth', 0.16); break;
            case 'whoosh': tone(180, 620, 0.32, 'sine', 0.1); break;
            case 'blip': tone(700 + Math.random()*200, 700 + Math.random()*200, 0.03, 'sine', 0.04); break;
            case 'submit': tone(400, 760, 0.18, 'triangle', 0.14); break;
            case 'round': tone(500, 640, 0.2, 'sine', 0.12); break;
            default: break;
        }
    }
    function playScoreSound(score) {
        if (!audioCtx || !soundEnabled) return;
        const now = audioCtx.currentTime;
        if (score >= 85) {
            [523.25, 659.25, 784.0, 1046.5].forEach((f, i) => {
                const t0 = now + i * 0.09;
                const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
                osc.connect(g); g.connect(audioCtx.destination);
                osc.type = 'square';
                osc.frequency.setValueAtTime(f, t0);
                g.gain.setValueAtTime(0.15, t0);
                g.gain.linearRampToValueAtTime(0.0001, t0 + 0.3);
                osc.start(t0); osc.stop(t0 + 0.3);
            });
        } else if (score >= 55) {
            tone(500, 700, 0.22, 'triangle', 0.14);
        } else if (score >= 30) {
            tone(400, 320, 0.25, 'sine', 0.12);
        } else {
            tone(300, 140, 0.4, 'sawtooth', 0.13);
        }
    }
    function playFanfare(good) {
        if (!audioCtx || !soundEnabled) return;
        const now = audioCtx.currentTime;
        const notes = good ? [523.25, 659.25, 784.0, 1046.5, 784.0, 1046.5, 1318.5] : [400, 380, 340, 300];
        notes.forEach((freq, i) => {
            const t0 = now + i * 0.12;
            const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
            osc.connect(g); g.connect(audioCtx.destination);
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq, t0);
            g.gain.setValueAtTime(0.16, t0);

        const c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;

        if (h < 60) { r = c; g = x; b = 0; }

        else if (h < 180) { r = 0; g = c; b = x; }
        else if (h < 240) { r = 0; g = x; b = c; }
        else if (h < 300) { r = x; g = 0; b = c; }
        else { r = c; g = 0; b = x; }
        return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];

        } else {
            rng = mulberry32((Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0);

        $('countdown-caption').textContent = 'Get ready to memorise...';
        playSound('tick');
        const iv = setInterval(() => {
            n -= 1;
            if (n <= 0) {
                clearInterval(iv);
                $('countdown-num').textContent = 'GO';
                playSound('go');
                setTimeout(showSceneScreen, 420);

                $('countdown-num').textContent = n;

        $('scene-frame').innerHTML = round.scene.build(round.colors);
        showScreen('screen-scene');
        playSound('whoosh');
        const durationMs = Math.max(4500, 7500 - session.roundIndex * 500);
        const start = performance.now();
        const fill = $('scene-timer-fill');
        let warned = false;
        function step(now) {
            const elapsed = now - start;
            const pct = Math.max(0, 1 - elapsed / durationMs);
            fill.style.width = (pct * 100) + '%';
            if (pct < 0.25 && !warned) {
                fill.style.background = 'linear-gradient(90deg,#E08A3C,#C24A4A)';
                warned = true;
            }
            if (elapsed < durationMs) {
                sceneTimerRAF = requestAnimationFrame(step);
            } else {
                fill.style.background = 'linear-gradient(90deg,#5AD696,#31B076)';
                fill.style.width = '100%';
                showQuestionScreen();
            }
        }
        sceneTimerRAF = requestAnimationFrame(step);
        // gentle ticking in the last 3 seconds
        const tickStart = durationMs - 3000;
        [0, 1, 2].forEach(i => {
            setTimeout(() => { if (session) playSound('tick'); }, Math.max(0, tickStart) + i * 1000);
        });
    }

    let pick = { h: 0, s: 0.7, v: 0.7 };
    function showQuestionScreen() {
        if (sceneTimerRAF) cancelAnimationFrame(sceneTimerRAF);
        const round = session.plan[session.roundIndex];
        $('question-obj-name').textContent = round.askedSlot.label;
        pick = { h: Math.random() * 360, s: 0.7, v: 0.7 };
        showScreen('screen-question');
        drawHueWheel();
        drawSVSquare();
        updatePickerCursors();
        paintMascot('mascot-question', hsvToHex(pick.h, pick.s, pick.v), 'neutral');
        playSound('round');
    }

    // ── Color picker: hue ring + saturation/brightness square ──────────────
    const hueCanvas = $('hue-canvas'), hueCtx = hueCanvas.getContext('2d');
    const svCanvas = $('sv-canvas'), svCtx = svCanvas.getContext('2d');
    const HUE_R_OUT = 82, HUE_R_IN = 60;
    function drawHueWheel() {
        const cx = 84, cy = 84;
        hueCtx.clearRect(0, 0, 168, 168);
        for (let deg = 0; deg < 360; deg += 1) {
            const rad0 = (deg - 90) * Math.PI / 180;
            const rad1 = (deg + 1 - 90) * Math.PI / 180;
            hueCtx.beginPath();
            hueCtx.arc(cx, cy, HUE_R_OUT, rad0, rad1);
            hueCtx.arc(cx, cy, HUE_R_IN, rad1, rad0, true);
            hueCtx.closePath();
            hueCtx.fillStyle = 'hsl(' + deg + ',100%,50%)';
            hueCtx.fill();
        }
    }
    function drawSVSquare() {
        const w = 108, h = 108;
        svCtx.clearRect(0, 0, w, h);
        const [r, g, b] = hsvToRgb(pick.h, 1, 1);
        svCtx.fillStyle = rgbToHex(r, g, b);
        svCtx.fillRect(0, 0, w, h);
        const gradWhite = svCtx.createLinearGradient(0, 0, w, 0);
        gradWhite.addColorStop(0, 'rgba(255,255,255,1)');
        gradWhite.addColorStop(1, 'rgba(255,255,255,0)');
        svCtx.fillStyle = gradWhite;
        svCtx.fillRect(0, 0, w, h);
        const gradBlack = svCtx.createLinearGradient(0, 0, 0, h);
        gradBlack.addColorStop(0, 'rgba(0,0,0,0)');
        gradBlack.addColorStop(1, 'rgba(0,0,0,1)');
        svCtx.fillStyle = gradBlack;
        svCtx.fillRect(0, 0, w, h);
    }
    function updatePickerCursors() {
        const cx = 84, cy = 84, rMid = (HUE_R_OUT + HUE_R_IN) / 2;
        const rad = (pick.h - 90) * Math.PI / 180;
        const hx = cx + rMid * Math.cos(rad), hy = cy + rMid * Math.sin(rad);
        $('hue-cursor').style.left = hx + 'px';
        $('hue-cursor').style.top = hy + 'px';
        $('sv-cursor').style.left = (pick.s * 108) + 'px';
        $('sv-cursor').style.top = ((1 - pick.v) * 108) + 'px';
        const hex = hsvToHex(pick.h, pick.s, pick.v);
        paintMascot('mascot-question', hex, 'neutral');
    }
    let lastBlip = 0;
    function maybeBlip() {
        const now = Date.now();
        if (now - lastBlip > 90) { playSound('blip'); lastBlip = now; }
    }
    function bindDrag(el, onMove) {
        let dragging = false;
        function pos(e) {
            const rect = el.getBoundingClientRect();
            const p = e.touches ? e.touches[0] : e;
            return { x: (p.clientX - rect.left) * (el.width || rect.width) / rect.width, y: (p.clientY - rect.top) * (el.height || rect.height) / rect.height, rectW: rect.width, rectH: rect.height, cx: p.clientX - rect.left, cy: p.clientY - rect.top };
        }
        function start(e) { dragging = true; onMove(pos(e)); e.preventDefault(); }
        function move(e) { if (dragging) { onMove(pos(e)); e.preventDefault(); } }
        function end() { dragging = false; }
        el.addEventListener('mousedown', start);
        el.addEventListener('touchstart', start, { passive: false });
        window.addEventListener('mousemove', move);
        window.addEventListener('touchmove', move, { passive: false });
        window.addEventListener('mouseup', end);
        window.addEventListener('touchend', end);
    }
    bindDrag($('hue-wheel-wrap'), (p) => {
        const cx = p.rectW / 2, cy = p.rectH / 2;
        const dx = p.cx - cx, dy = p.cy - cy;
        let deg = Math.atan2(dy, dx) * 180 / Math.PI + 90;
        if (deg < 0) deg += 360;
        pick.h = deg;
        drawSVSquare();
        updatePickerCursors();
        maybeBlip();
    });
    bindDrag($('sv-wrap'), (p) => {
        const w = p.rectW, h = p.rectH;
        pick.s = Math.max(0, Math.min(1, p.cx / w));
        pick.v = Math.max(0, Math.min(1, 1 - p.cy / h));
        updatePickerCursors();
        maybeBlip();
    });

    $('btn-submit-color').addEventListener('click', () => {
        const round = session.plan[session.roundIndex];
        const guessHex = hsvToHex(pick.h, pick.s, pick.v);
        const actualHex = round.colors[round.askedSlot.key];
        const dE = colorDeltaE(guessHex, actualHex);
        const score = scoreFromDeltaE(dE);
        session.results.push({ score, guessHex, actualHex, sceneLabel: round.scene.label, objLabel: round.askedSlot.label });
        playSound('submit');
        showRevealScreen(guessHex, actualHex, score);
    });

    function showRevealScreen(guessHex, actualHex, score) {
        showScreen('screen-reveal');
        $('reveal-score').textContent = score;
        $('reveal-flavor').textContent = flavorForScore(score);
        $('reveal-swatch-you').style.background = guessHex;
        $('reveal-hex-you').textContent = guessHex.toUpperCase();
        $('reveal-swatch-actual').style.background = actualHex;
        $('reveal-hex-actual').textContent = actualHex.toUpperCase();
        const mood = score >= 75 ? 'happy' : score >= 40 ? 'neutral' : 'sad';
        paintMascot('mascot-reveal', actualHex, mood);
        playScoreSound(score);
    }

    $('btn-next-round').addEventListener('click', () => {
        session.roundIndex += 1;
        if (session.roundIndex >= session.plan.length) {
            finishSession();
        } else {
            runCountdownThenScene();
        }
    });

    function finishSession() {
        const avg = Math.round(session.results.reduce((a, r) => a + r.score, 0) / session.results.length);
        showScreen('screen-results');
        $('results-avg').textContent = avg;
        $('results-flavor').textContent = flavorForScore(avg);
        const grid = $('results-grid');
        grid.innerHTML = '';
        session.results.forEach(r => {
            const cell = document.createElement('div');
            cell.className = 'pk-grid-cell';
            cell.style.background = gridCellColor(r.score);
            grid.appendChild(cell);
        });
        const mood = avg >= 75 ? 'happy' : avg >= 40 ? 'neutral' : 'sad';
        paintMascot('mascot-results', session.results[session.results.length - 1].actualHex, mood);

        const badges = $('results-badges');
        badges.innerHTML = '';
        if (session.mode === 'daily') {
            const today = todayStr();
            const already = lsGet(DAILY_KEY(today), null);
            if (!already) {
                lsSet(DAILY_KEY(today), { avg, ts: Date.now() });
                const d = getStreakData();
                const yest = dateStr(new Date(Date.now() - 86400000));
                const newCurrent = (d.last === yest) ? d.current + 1 : 1;
                setStreakData({ current: newCurrent, best: Math.max(d.best, newCurrent), last: today });
            }
            const streak = getStreakData();
            badges.innerHTML = '<span class="pk-badge">Streak ' + streak.current + '&#128293;</span><span class="pk-badge">Best ' + streak.best + '</span>';
            $('btn-share').classList.remove('pk-hidden');
        } else {
            $('btn-share').classList.remove('pk-hidden');
        }
        playFanfare(avg >= 60);
    }

    function buildShareText() {
        const grid = session.results.map(r => {
            if (r.score >= 80) return '\u{1F7E9}';
            if (r.score >= 60) return '\u{1F7E8}';
            if (r.score >= 35) return '\u{1F7E7}';
            return '\u{1F7E5}';
        }).join('');
        const avg = Math.round(session.results.reduce((a, r) => a + r.score, 0) / session.results.length);
        const header = session.mode === 'daily'
            ? "Psy-Koh's Color Match — Daily " + todayStr()
            : "Psy-Koh's Color Match — Practice run";
        let streakBit = '';
        if (session.mode === 'daily') {
            const streak = getStreakData().current;
            if (streak > 1) streakBit = ' \u{1F525}' + streak + 'd';
        }
        return header + '\n' + grid + '  Avg ' + avg + '/100' + streakBit + '\n\n' +
            'Play: ' + location.href.split('#')[0].split('?')[0];
    }
    $('btn-share').addEventListener('click', async () => {
        const text = buildShareText();
        const btn = $('btn-share');
        try {
            if (navigator.share) { await navigator.share({ text: text }); return; }
        } catch (e) { return; }
        try {
            await navigator.clipboard.writeText(text);
            btn.textContent = 'Copied!';
            setTimeout(() => { btn.textContent = 'Share Result'; }, 1600);
        } catch (e) {
            btn.textContent = 'Copy failed';
            setTimeout(() => { btn.textContent = 'Share Result'; }, 1600);
        }
    });

    function refreshStartBadges() {
        const today = todayStr();
        const played = lsGet(DAILY_KEY(today), null);
        const streak = getStreakData();
        const badges = [];
        if (played) badges.push('<span class="pk-badge">Today: ' + played.avg + '/100</span>');
        if (streak.current > 0) badges.push('<span class="pk-badge">Streak ' + streak.current + '&#128293;</span>');
        $('start-badges').innerHTML = badges.join('');
    }

    $('btn-daily').addEventListener('click', () => { playSound('click'); startSession('daily'); });
    $('btn-practice').addEventListener('click', () => { playSound('click'); startSession('practice'); });
    $('btn-howto').addEventListener('click', () => { playSound('click'); showScreen('screen-howto'); });
    $('btn-howto-back').addEventListener('click', () => { playSound('click'); showScreen('screen-start'); });
    $('btn-play-again').addEventListener('click', () => { playSound('click'); startSession(session.mode); });
    $('btn-menu').addEventListener('click', () => { playSound('click'); refreshStartBadges(); showScreen('screen-start'); });

    paintMascot('mascot-start', '#5AD696', 'happy');
    refreshStartBadges();
    showScreen('screen-start');
})();
</script>
